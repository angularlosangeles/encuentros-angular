<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: una columna tipo "pizarra de turnos" pensada para el teléfono; cabecera fija con la semana y pestañas abajo del título */
:root{
  --paper:#f3f5f1; --card:#ffffff; --ink:#18323a; --muted:#5d7178; --line:#d9e0dc;
  --accent:#1f6d63; --accent-ink:#ffffff; --accent-soft:#e1efe9; --mark:#f2c94c; --mark-soft:#fbf1cf;
  --danger:#b3412f; --on-mark:#2b2410;
  --display:"Archivo",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111a1d; --card:#192428; --ink:#e6eeec; --muted:#93a6a9; --line:#2a383c;
  --accent:#55b3a3; --accent-ink:#0d1a1c; --accent-soft:#1d3532; --mark:#e9c25a; --mark-soft:#3a3320; --danger:#e57a66; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111a1d; --card:#192428; --ink:#e6eeec; --muted:#93a6a9; --line:#2a383c;
  --accent:#55b3a3; --accent-ink:#0d1a1c; --accent-soft:#1d3532; --mark:#e9c25a; --mark-soft:#3a3320; --danger:#e57a66; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:620px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:1.55rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:700}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px 8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tab{padding:7px 14px;border-radius:999px;font-weight:700;font-size:.92rem;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.weekbar{display:flex;align-items:center;gap:8px}
.weekbar .lbl{flex:1;min-width:0;text-align:center}
.weekbar .lbl b{font-family:var(--display);font-size:1.08rem;display:block}
.weekbar .lbl span{font-size:.85rem;color:var(--muted)}
.navbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1.2rem;font-weight:700;flex:none}
.today{font-size:.78rem;font-weight:700;color:var(--accent);padding:2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.mine{background:var(--mark-soft);border-color:var(--mark)}
.mine ul{margin:6px 0 0;padding-left:20px}
.list{display:flex;flex-direction:column;gap:10px}
.task{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.task h3{font-size:1.02rem;font-weight:700}
.task .detail{grid-column:1/-1;font-size:.92rem;color:var(--muted);white-space:pre-wrap}
.task .who{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.task.me{border-color:var(--mark);box-shadow:inset 4px 0 0 var(--mark)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--accent-soft);font-size:.9rem;font-weight:700}
.chip.empty{padding:4px 10px;background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:400}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;color:#fff;font-family:var(--display);font-weight:800;flex:none}
.tag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:6px;background:var(--mark-soft);color:var(--ink);border:1px solid var(--mark)}
.edit{font-size:.85rem;font-weight:700;color:var(--accent);padding:4px 2px}
.btn{padding:10px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who-pick{display:flex;flex-wrap:wrap;gap:6px}
.pick{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.9rem}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note{display:flex;flex-direction:column;gap:4px}
.note p{margin:0;white-space:pre-wrap}
.note time{font-size:.8rem;color:var(--muted)}
input[type=text],textarea{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:700}
.ed-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding-block:10px;border-top:1px solid var(--line)}
.ed-item:first-child{border-top:0}
.ed-item > div{min-width:0;display:flex;flex-direction:column;gap:6px}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);color:var(--danger);font-weight:700}
.switch{display:flex;gap:10px;align-items:flex-start}
.switch input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto;box-sizing:border-box}
.status{font-size:.85rem;color:var(--muted);min-height:1.2em}
.empty-state{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.hero{display:flex;flex-direction:column;gap:10px}
.team{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase}
.satrow{display:flex;align-items:center;gap:10px}
.sat{flex:1;min-width:0;background:var(--mark);color:var(--on-mark);border-radius:20px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.satday{font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700}
.sat b{font-family:var(--display);font-size:clamp(1.7rem,8vw,2.3rem);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.satnote{font-size:.85rem;font-weight:700;opacity:.8}
.satnote button{color:inherit;text-decoration:underline;font-weight:700;padding:2px 4px}
select{width:100%;box-sizing:border-box;padding:12px 14px;font-size:1.1rem;border-radius:12px;border:1px solid var(--line);background:var(--paper)}
.pickme{display:flex;flex-direction:column;gap:8px}
.hint{text-align:center;color:var(--muted);margin:4px 0}
.deleg{display:flex;flex-direction:column;gap:6px;border-left:5px solid var(--accent)}
.deleg h3{font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:12px}
.ico{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--mark-soft);font-size:1.6rem;line-height:1}
.tname{display:flex;flex-direction:column;gap:2px;min-width:0}
.arrive{font-family:var(--body);font-size:.82rem;font-weight:400;color:var(--muted)}
.arrive b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.timef{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:700}
.timef input{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.satev{margin-top:6px;background:var(--on-mark);color:var(--mark);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:800;letter-spacing:.02em}
.satdet{font-size:.85rem;font-weight:700;margin-top:4px}
.lbl{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--mark-soft);border:1px solid var(--mark);color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
.event{background:var(--mark-soft);border-color:var(--mark)}
.event b{font-family:var(--display);font-size:1.1rem}
.foot{font-size:.78rem;color:var(--muted);text-align:center}
.foot a{color:var(--accent)}
.unk{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ico.sm{width:30px;height:30px;border-radius:9px;font-size:1.05rem}
.mini h3{display:flex;align-items:center;gap:8px}
.icopick{display:flex;flex-wrap:wrap;gap:6px}
.icopick button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:1.3rem;line-height:1}
.icopick button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.deleg .desc{margin:0;font-size:.86rem;line-height:1.45;color:var(--muted);white-space:pre-wrap}
.how{border-top:1px solid var(--line);padding-top:8px}
.how summary{cursor:pointer;font-size:.9rem;font-weight:700;color:var(--accent);padding:4px 0;list-style:none;display:flex;align-items:center;gap:6px}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.how[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.how .desc{margin-top:6px}
.deleg .with{margin:0;font-size:.8rem;color:var(--muted)}
.deleg .with b{color:var(--ink);font-weight:700}
details.all{border-top:1px solid var(--line);padding-top:12px}
details.all summary{cursor:pointer;font-weight:700;color:var(--accent);padding:6px 0;list-style-position:inside}
details.all .list{margin-top:10px}
.mini{display:flex;flex-direction:column;gap:6px;padding:12px 14px}
.mini .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mini h3{font-size:.98rem}
.mini .who{display:flex;flex-wrap:wrap;gap:6px}
.mini.me{border-color:var(--mark);box-shadow:inset 4px 0 0 var(--mark)}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

.loading{text-align:center;color:var(--muted);padding:24px 0}
</style>
</head>

const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/["“”]/g,"").replace(/\s+/g," ").trim();

function titleCase(s){return s.toLowerCase().split(" ").map(w=>w.length===1?w.toUpperCase()+".":w[0].toUpperCase()+w.slice(1)).join(" ")}

function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}

function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];

function parseProgram(V){
  const res={};if(!Array.isArray(V))return res;
  const amap=aliasMap(),cols=CFG.sheetCols||{};

  for(const r of V.slice(0,3)){const m=(r||[]).join(" ").match(/20\d\d/);if(m){year=+m[0];break}}
  const hi=V.findIndex(r=>(r||[]).some(c=>norm(c)==="MES"));if(hi<0)return res;
  const H=V[hi].map(norm),monCol=H.indexOf("MES");let dayCol=H.indexOf("DIA");if(dayCol<0)dayCol=monCol+1;
  const colOf={};let detailCol=-1;
  H.forEach((h,i)=>{if(!h)return;if(h.startsWith("DETALLE")&&detailCol<0)detailCol=i;
    for(const [tid,kw] of Object.entries(cols)){if(colOf[tid]!=null)continue;if(kw.startsWith("^")?h.startsWith(kw.slice(1)):h.includes(kw))colOf[tid]=i}});

    const day=parseInt(String(row[dayCol]??"").replace(/\D/g,""),10);if(mon<0||!day||day>31)continue;

}
// Hoja opcional DELEGACIONES: DELEGACIÓN | HORA DE LLEGADA | ÍCONO | DESCRIPCIÓN
function applyDelegSheet(V){
  if(!Array.isArray(V))return;
  const hi=V.findIndex(r=>(r||[]).some(c=>norm(c).startsWith("DELEGACION"))&&(r||[]).some(c=>norm(c).includes("HORA")));if(hi<0)return;

  let h=`<div class="list"><div class="card pickme"><label class="eyebrow" for="meSel">¿Quién eres?</label><select id="meSel"><option value="">Selecciona tu nombre…</option>${sorted.map(p=>`<option value="${esc(p.id)}"${S.me===p.id?" selected":""}>${esc(p.name)}</option>`).join("")}</select></div>`;
  if(S.me&&person(S.me)){
    const mine=TASKS.filter(t=>a[t.id].ids.includes(S.me));
    h+=`<h2 style="margin-top:6px">Tus delegaciones</h2>`;
    h+=mine.length?mine.map(t=>{const others=a[t.id].ids.filter(id=>id!==S.me).map(id=>person(id)&&person(id).name).filter(Boolean);
      return `<div class="card deleg"><h3>${icon(t)}<span class="tname"><span>${esc(t.name)}</span>${arrive(t)}</span></h3>${t.detail?`<details class="how"><summary>¿En qué consiste?</summary><p class="desc">${esc(t.detail)}</p></details>`:""}${a[t.id].labels.length?`<div class="row">${a[t.id].labels.map(l=>`<span class="lbl">${esc(l)}</span>`).join("")}</div>`:""}${others.length?`<p class="with">Junto a <b>${others.map(esc).join(", ")}</b></p>`:""}</div>`}).join("")
      :`<div class="card"><p style="margin:0">${sw&&sw.event?`Este sábado hay <b>${esc(sw.event)}</b>. No tienes delegaciones asignadas.`:"No tienes delegaciones este sábado."}</p></div>`;
  }else h+=`<p class="hint">Elige tu nombre para ver tus delegaciones.</p>`;
  h+=`<details class="all"${S.allOpen?" open":""}><summary>Ver todas las delegaciones</summary><div class="list">`+TASKS.filter(t=>!a[t.id].none).map(t=>{const r=a[t.id],me=S.me&&r.ids.includes(S.me);
    return `<div class="card mini${me?" me":""}"><div class="hd"><h3>${icon(t,true)}<span class="tname"><span>${esc(t.name)}</span>${arrive(t)}</span></h3></div><div class="who">${r.ids.map(chip).join("")}${r.labels.map(l=>`<span class="lbl">${esc(l)}</span>`).join("")}${(!r.ids.length&&!r.labels.length)?`<span class="chip empty">Sin asignar</span>`:""}</div></div>`}).join("")+`</div></details></div>`;
  return h;
}
function render(){
  const det=document.querySelector("details.all");if(det)S.allOpen=det.open;
  renderHeader();$("#view").innerHTML=renderWeek();
  $("#foot").textContent=S.err||(S.stamp?(S.live?`Datos de la planilla · actualizados ${fmtStamp(S.stamp)}`:`Sin conexión · mostrando datos del ${fmtStamp(S.stamp)}`):"");
}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.id==="prev"){S.monday=addDays(S.monday,-7);render()}else if(b.id==="next"){S.monday=addDays(S.monday,7);render()}else if(b.id==="goToday"){S.monday=currentMonday();render()}});
document.addEventListener("change",e=>{if(e.target.id==="meSel"){S.me=e.target.value||null;ls.set("delegaciones.me",S.me);render();window.scrollTo(0,0)}});

// ---- Arranque: muestra lo último guardado y luego trae la planilla en vivo ----
let cached=null;try{cached=JSON.parse(ls.get("delegaciones.cache")||"null")}catch(e){}
const snap=JSON.parse(document.getElementById("snap").textContent);
const start=(cached&&cached.fetchedAt>snap.fetchedAt)?cached:snap;
load(start);render();
async function fetchTab(tab){const r=await fetch(csvURL(tab),{cache:"no-store"});if(!r.ok)throw new Error("http "+r.status);const t=await r.text();if(/^\s*</.test(t))throw new Error("no csv");return parseCSV(t)}
async function refresh(){
  try{
    const [values,deleg]=await Promise.all([fetchTab(TAB_PROG),fetchTab(TAB_DELEG).catch(()=>null)]);
    const src={fetchedAt:new Date().toISOString(),values,deleg};
    load(src);S.live=true;S.err="";ls.set("delegaciones.cache",JSON.stringify(src));
  }catch(e){S.live=false;S.err=S.stamp?`No se pudo leer la planilla ahora · mostrando datos del ${fmtStamp(S.stamp)}`:"No se pudo leer la planilla. Revisa tu conexión."}
  render();
}
refresh();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh()});
})();
</script>
</body>
</html>
